name: Build SiriSound (arm64e)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Download iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          curl -L -o iPhoneOS16.5.sdk.tar.xz \
            "https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.tar.xz"
          tar -xf iPhoneOS16.5.sdk.tar.xz
          ls -la "$HOME/theos/sdks/"

      - name: Build tweak package
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1
        env:
          THEOS: ${{ env.THEOS }}

      - name: Locate deb
        run: |
          echo "=== packages dir ==="
          ls -la packages/ 2>/dev/null || true
          echo "=== .theos/packages ==="
          ls -la .theos/packages/ 2>/dev/null || true
          echo "=== find deb ==="
          find . -name "*.deb" -type f

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiriSound-arm64e-deb
          path: |
            packages/*.deb
            .theos/packages/*.deb
          if-no-files-found: error
